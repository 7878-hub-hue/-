<script>


const TRAITS = [
  {label:"锋芒表达", low:"含蓄", high:"鲜明"},
  {label:"谋略方式", low:"直觉行动", high:"审慎布局"},
  {label:"情感投入", low:"自持疏离", high:"深情相待"},
  {label:"风险边界", low:"愿意信任", high:"谨慎设防"},
  {label:"自主意识", low:"借势协作", high:"独立做主"},
  {label:"成就取向", low:"安稳自在", high:"积极争取"}
];
// 向量顺序与 TRAITS 一一对应；标定值 -2~2，仅用于娱乐型人格相似度，不是临床量表。
const CHARACTERS = [
  {name:"甄嬛", archetype:"清醒的破局者", glyph:"嬛", vector:[0,2,1,1,2,2],
   motto:"心有柔软，亦有破局之力。", portrait:"你能体察情绪，也会在局势改变时重新寻找出路。你不迷信一种方法，重要的是守住真正想守住的东西。",
   strength:"擅长从细节拼出全局，并在退让与出击之间找到时机。", shadow:"有时习惯独自承担，难以坦然向别人示弱。",
   bond:"你珍视被理解的关系，但会用时间检验信任。", fate:"你最终学会改变棋局，而不只是等待命运落子。"},
  {name:"沈眉庄", archetype:"清醒的理想主义者", glyph:"眉", vector:[-1,0,2,0,2,0],
   motto:"身处风雨，也要留一身风骨。", portrait:"你温柔有礼，却有不可轻易跨越的原则。比起一时的输赢，你更在乎做过的选择是否对得起自己。",
   strength:"情绪稳定、待人真诚，在关键处敢于坚持。", shadow:"对失望的人和事，偶尔会关上门而不再解释。",
   bond:"你不求热闹的交际，只愿与懂你的人长久相伴。", fate:"你守住了自己的分寸，也留下了令人信服的风骨。"},
  {name:"安陵容", archetype:"敏感的观察者", glyph:"容", vector:[-1,1,0,2,-1,2],
   motto:"听得见细语，也渴望被看见。", portrait:"你对气氛和他人的变化十分敏锐，常常比旁人更早察觉暗流。被认可会让你迸发惊人的潜力。",
   strength:"心思细、学习快，懂得在不利条件下寻找机会。", shadow:"容易把外界评价放得太重，反而低估自己的价值。",
   bond:"你期待稳定的回应与被珍惜的感觉，也需要学习主动表达需求。", fate:"当你不再只向别人证明自己，才会发现真正的底气。"},
  {name:"华妃", archetype:"炽烈的掌控者", glyph:"华", vector:[2,-2,2,-1,0,2],
   motto:"宁可灿烂，不肯黯淡。", portrait:"你热烈、骄傲，愿意为在乎的人与事用尽全力。你不擅长假装无所谓，喜怒也因此格外真切。",
   strength:"有行动力、有担当，能在关键时刻鼓舞身边人。", shadow:"急于求成或过度投入时，容易忽略局势的复杂。",
   bond:"你需要坦诚和重视，最难忍受敷衍与冷漠。", fate:"你的光芒不必靠压过谁证明，学会放手后反而更加耀眼。"},
  {name:"皇后宜修", archetype:"隐忍的布局者", glyph:"宜", vector:[-1,2,-1,2,1,2],
   motto:"落子之前，先看全盘。", portrait:"你习惯在公开表态前先整理信息，善于从长远角度安排事情。掌握节奏让你感到踏实。",
   strength:"耐心、克制、组织能力强，能把复杂事务理出线索。", shadow:"过度追求确定性，可能让自己陷入持续的紧绷。",
   bond:"你更相信长期兑现的承诺，而不是一时动听的话。", fate:"真正的安定不只是局面可控，也来自对不确定的接纳。"},
  {name:"端妃", archetype:"沉静的长期主义者", glyph:"端", vector:[-2,2,0,2,1,1],
   motto:"不争一时，而观千秋。", portrait:"你不急于显露锋芒，更愿意等待信息充分再行动。沉默不是没有主见，而是一种对节奏的把握。",

const QUESTIONS = [{"id":1,"title":"初入宫中，第一次与同院的小主们见面，你会如何表现？","options":["主动与大家交谈，迅速活跃气氛。","找机会展现自己的特别之处。","礼貌应答，先观察大家的性格。","安静地待着，不急于被人认识。"],"scores":[[2,-1,1,-1,1,0],[2,0,-1,0,1,2],[-1,1,0,1,0,0],[-2,0,0,1,1,-1]]},{"id":2,"title":"你发现掌事姑姑对不同的人说了两套完全不同的话，你会？","options":["当面指出矛盾，避免误会扩大。","暗暗记下细节，寻找更多证据。","不轻易参与，只管做好自己的事。","故意多问几句，试探她真正的意图。"],"scores":[[2,-1,0,-1,2,0],[-1,2,0,2,0,0],[-2,0,-1,1,0,-1],[1,2,0,1,1,1]]},{"id":3,"title":"与你交好的小主被误会偷拿宫花，众人都不愿替她说话，你会？","options":["当众站出来解释，哪怕自己被牵连。","私下告诉她自己知道的线索。","找可信的人一起帮她查清事实。","暂时不介入，以免事情越闹越大。"],"scores":[[2,-1,2,-2,1,0],[-1,1,2,1,0,-1],[0,2,2,1,0,1],[-2,1,-1,2,1,0]]},{"id":4,"title":"分配住处前，你有机会表达一次意愿，你会？","options":["接受上位者安排，顺势而为。","先询问熟悉规矩之人的意见。","比较各处优劣，再自己做决定。","宁选偏远但自在的地方，也不想受约束。"],"scores":[[-1,-1,0,-1,-2,-1],[-1,1,1,1,-1,0],[0,2,0,1,2,0],[-1,0,0,0,2,-2]]},{"id":5,"title":"宫中要举办赏菊宴，你准备如何打扮？","options":["穿最亮眼的一身，既然去了就要令人难忘。","符合规矩、得体即可，没必要突出。","挑一件独特的首饰，让人留下印象。","穿得低调舒适，安心欣赏宴席。"],"scores":[[2,-1,0,-1,0,2],[-1,0,0,1,0,-1],[1,2,0,0,1,2],[-2,0,0,1,2,-2]]},{"id":6,"title":"一位颇有权势的妃嫔邀请你加入她的阵营，你会？","options":["直接答应，有靠山总比孤身一人强。","当面婉拒，即便可能得罪对方。","表面答应，但悄悄给自己留好退路。","不急于表态，先了解她的处境和目的。"],"scores":[[1,-1,0,-1,-2,2],[2,-1,0,1,2,-1],[-1,2,-1,2,0,1],[-1,2,0,2,1,0]]},{"id":7,"title":"最亲近的朋友得到了你也十分想要的赏赐，你会？","options":["真心为她高兴，主动替她庆祝。","心里有点失落，但仍然为她开心。","表达祝福后，把精力放回自己身上。","暂时减少来往，不想让比较影响心情。"],"scores":[[1,-1,2,-1,0,-1],[-1,0,2,0,0,0],[0,1,0,1,2,2],[-2,0,-2,2,1,0]]},{"id":8,"title":"旧事未了，新的考验又来了。","options":["","","",""],"scores":[[2,-1,0,0,2,1],[-1,1,0,1,0,0],[-1,2,0,2,1,2],[0,1,1,1,-1,1]],"fork":{"from":3,"mapping":["help","quiet","help","quiet"]},"branches":{"help":{"title":"你出面帮助过的人，悄悄托你转交一封来历不明的密信。你会？","lead":"你曾在风波中出手相助，因此收获了对方的信任。如今，这份信任成了新的考验。","options":["直接表明立场，不愿掺和不清楚的事。","先核对密信来源，再决定是否帮忙。","顺藤摸瓜，查查背后究竟是谁在设局。","借熟识的掌事之人，试探其中隐情。"]},"quiet":{"title":"有人利用你当时的沉默散布流言，暗示你也牵涉其中。你会？","lead":"你当时没有站到台前，却依然被人卷进流言。你需要为自己找到新的位置。","options":["立即公开反驳，表明与自己无关。","搜集能证明自己清白的证据。","暂时不动声色，等散布流言的人露出破绽。","请双方共同认识的人出面澄清。"]}}},{"id":9,"title" function newState() {
  return {v:VERSION,view:"quiz",index:0,answers:Array(22).fill(null)};
}
function restoreState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(!raw || raw.v !== VERSION || !Array.isArray(raw.answers) || raw.answers.length !== QUESTIONS.length) return null;
    const answers = raw.answers.map(a => Number.isInteger(a) && a >= 0 && a < 4 ? a : null);
    let index = Number.isInteger(raw.index) ? Math.min(21,Math.max(0,raw.index)) : 0;
    const missing = answers.findIndex(a => a === null);
    if(missing !== -1 && index > missing) index = missing;
    const view = raw.view === "result" && missing === -1 ? "result" : "quiz";
    return {v:VERSION,view,index,answers};
  } catch (_) {return null;}
}

function chapterOf(id) {return CHAPTERS.find(c=>id>=c.start&&id<=c.end);}
function resolvedQuestion(index, answers=state.answers) {
  const q = QUESTIONS[index];
  if(!q.fork) return {title:q.title,options:q.options,lead:"",isBranch:false,branch:null};
  const prior = answers[q.fork.from-1];
  const key = q.fork.mapping[prior===null?0:prior];
  const b = q.branches[key];
  return {...b,isBranch:true,branch:key};
}

function normalizedStats(answers, subset=null) {
  const raw=Array(6).fill(0), variance=Array(6).fill(0);
  const included=subset || QUESTIONS.map((_,i)=>i);
  for(const i of included) {
    const opt=answers[i];if(opt===null)continue;
    const s=QUESTIONS[i].scores;
    for(let d=0;d<6;d++){
      const avg=s.reduce((tot,v)=>tot+v[d],0)/4;
      const v=s.reduce((tot,row)=>tot+(row[d]-avg)**2,0)/4;
      raw[d]+=s[opt][d]-avg;
      variance[d]+=v;
    }
  }
  return raw.map((v,d)=>Math.max(-2.5,Math.min(2.5,v/Math.sqrt(Math.max(variance[d],.001)))));
}
function cosine(a,b) {
  const dot=a.reduce((sum,v,i)=>sum+v*b[i],0);
  const al=Math.hypot(...a),bl=Math.hypot(...b);
  return al<.00001||bl<.00001?0:dot/(al*bl);
}

const CHARACTER_PRIORS = [0.071, 0.1427, 0.0419, -0.0846, -0.039, -0.0299, -0.0472, 0.0535, -0.0146, -0.1665, -0.0143, -0.0706, 0.0925, 0.0149, 0.0406, 0.0096];
function rankedCharacters(stats) {
  return CHARACTERS.map((ch,index)=>({index,similarity:cosine(stats,ch.vector)+CHARACTER_PRIORS[index]}))
    .sort((a,b)=>b.similarity-a.similarity || a.index-b.index);
}

  const ordered=stats.map((v,i)=>({i,v})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));

function selectOption(index) {
  if(screen!=="quiz"||index<0||index>3)return;
  const i=state.index,old=state.answers[i];
  if(old!==index) {
    const downstream={2:7,5:12,11:17,15:20};
    if(Object.hasOwn(downstream,i)&&old!==null) {
      const later=downstream[i],branch=QUESTIONS[later].fork;
      if(branch.mapping[old]!==branch.mapping[index]) state.answers[later]=null;
    }
    state.answers[i]=index;

  render();
  const active=root.querySelector(`[data-option="${index}"]`);

}
function changeQuestion(delta){
  if(screen!=="quiz")return;
  if(delta>0 && state.answers[state.index]===null)return;
  if(delta>0 && state.index===21){
    if(state.answers.some(x=>x===null)){
      state.index=state.answers.findIndex(x=>x===null);
      render();toTop();showToast("请先补完因剧情变化而需要重答的题目");
    } else {
      screen="result";state.view="result";saveState();render();toTop();
    }
    return;
  }
  state.index=Math.max(0,Math.min(21,state.index+delta));
  state.view="quiz";saveState();render();toTop();
}

  const content=`我的《甄嬛传》宫廷人格是「${r.main.name}」——${r.main.archetype}！\n内心的另一面是「${r.inner.name}」。\n${r.main.motto}\n来测测你是谁：${url}`;
  try {
    if(navigator.share && window.isSecureContext){
      await navigator.share({title:"若你入宫，能活成谁？",text:content,url});
      return;
    }
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(content);showToast("结果已复制，去分享给朋友吧 🌸");return;
    }
    showToast(copyFallback(content)?"结果已复制，去分享给朋友吧 🌸":"复制失败，可尝试保存分享卡");
  } catch(err) {
    if(err && err.name==="AbortError")return;
    try {
      await navigator.clipboard.writeText(content);
      showToast("结果已复制，去分享给朋友吧 🌸");
    }catch(_) {showToast(copyFallback(content)?"结果已复制":"复制失败，可尝试保存分享卡");}
  }
}
function roundedRect(ctx,x,y,w,h,r) {
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wrapCanvasText(ctx,text,maxWidth) {
  const rows=[];let line="";
  for(const ch of text) {
    if(ctx.measureText(line+ch).width>maxWidth && line){rows.push(line);line=ch;}
    else line+=ch;
  }
  if(line)rows.push(line);
  return rows;
}
function drawPoster(r) {

  x.strokeStyle="rgba(237,210,159,.23)";x.lineWidth=2;[259,287,320].forEach(rad=>{x.beginPath();x.arc(540,458,rad,0,Math.PI*2);x.stroke();});
  x.textAlign="center";

  x.strokeStyle="#bda078";x.beginPath();x.moveTo(410,920);x.lineTo(670,920);x.stroke();
  x.fillStyle="#e7e0cd";x.font='30px "Songti SC","SimSun",serif';
  wrapCanvasText(x,r.main.motto,750).forEach((line,i)=>x.fillText(line,540,987+i*52));
  x.fillStyle="#f8f1e5";x.fillRect(67,1117,946,200);
  x.fillStyle="#6a5546";x.font='27px "Songti SC","SimSun",serif';x.fillText(`内心的另一面 · ${r.inner.name}`,540,1192);
  x.fillStyle="#876e50";x.font='24px "Songti SC","SimSun",serif';
  const path=`${r.first}  →  ${r.middle}  →  ${r.last}`;
  wrapCanvasText(x,path,825).forEach((line,i)=>x.fillText(line,540,1249+i*38));
  x.fillStyle="#6b6a5e";x.font='22px "Songti SC","SimSun",serif';x.fillText("若你入宫，能活成谁？ · 非官方同人趣味测试",540,1371);
  return canvas;
}
function savePoster(){
  const r=personalityResult();if(!r)return;
  try {
    const canvas=drawPoster(r);
    const downloadBlob=(blob)=>{
      const u=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=u;a.download=`宫廷人格-${r.main.name}.png`;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),1000);
      showToast("分享卡片已生成 🌸");
    };
    if(canvas.toBlob)canvas.toBlob(blob=>blob?downloadBlob(blob):showToast("无法导出图片，请尝试截图"),"image/png");
    else {
      const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=`宫廷人格-${r.main.name}.png`;a.click();
      showToast("分享卡片已生成 🌸");
    }
  } catch(err){showToast("图片生成失败，仍可直接截图分享");}
}
root.addEventListener("click",event=>{
  const opt=event.target.closest("[data-option]");
  if(opt){selectOption(Number(opt.dataset.option));return;}
  const btn=event.target.closest("[data-action]");if(!btn)return;
  switch(btn.dataset.action) {
    case "start":resetGame();break;
    case "resume":resume();break;
    case "prev":changeQuestion(-1);break;
    case "next":changeQuestion(1);break;
    case "home":screen="intro";render();toTop();break;
    case "reset":resetGame();break;
    case "copy":copyResult();break;
    case "poster":savePoster();break;
  }
});
document.addEventListener("keydown",event=>{
  if(screen!=="quiz"||event.altKey||event.ctrlKey||event.metaKey||event.isComposing)return;
  if(/^[1-4]$/.test(event.key)){
    event.preventDefault();selectOption(Number(event.key)-1);
  }
});
